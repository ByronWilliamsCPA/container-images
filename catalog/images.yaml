  # ---------------------------------------------------------------------------
  # Vendor application images (vendor tier, ADR-032)
  # ---------------------------------------------------------------------------
  # Third-party application images mirrored from Docker Hub for the CYO
  # Supabase self-host stack. These are TRANSPORT copies of upstream: they are
  # not hardened, not rebuilt, and carry no upstream signature that this
  # pipeline verifies. They exist so the stack pulls from GHCR (one registry,
  # one scan gate, no Docker Hub rate limits) instead of from Docker Hub.
  #
  # Rules for this tier (enforced by scripts/validate_catalog_schema.py):
  #   - upstream.registry is docker.io, upstream.name is <namespace>/<repo>
  #   - upstream.digest is REQUIRED and is the pin of record. It is the upstream
  #     multi-arch INDEX digest; the mirror resolves the platform_compatibility
  #     .default child manifest from it (an index immutably determines its
  #     children), scans and copies that one manifest, and never follows the tag
  #   - upstream.tag is an immutable version tag, never latest/stable/edge/...
  #   - ghcr.name starts with vendor- (and no other tier may use that prefix),
  #     ghcr.tag keeps the upstream tag
  #
  # Pins taken from github.com/supabase/supabase docker/docker-compose.yml as
  # of 2026-10-18; each digest was re-resolved with `crane digest` that day.
  # All eleven upstream tags are OCI image indexes carrying linux/amd64 and
  # linux/arm64. Like every other tier, only ONE platform is published
  # (linux/amd64): it is the manifest the Trivy gate and Syft actually inspect
