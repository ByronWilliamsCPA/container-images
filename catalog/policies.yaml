apiVersion: v1
kind: ImagePolicies

metadata:
  schema_version: "1.0"
  description: Scanner and exception policies for the A2 image promotion pipeline
  maintainer: ByronWilliamsCPA/container-images
  last_updated: "2026-10-19"

# Vulnerability scanner policy applied by publish-approved-image.yml (A2).
# scripts/load_scanner_policy.py reads this file at promotion time and
# translates it into the concrete scanner knobs: the Snyk severity floor, the
# Trivy severity list, and the Cosign identity checks below.
#
# snyk / trivy action values:
#   block   -- promotion fails; image is not published to GHCR
#   warn    -- promotion continues; GitHub Actions warning annotation emitted
#   record  -- promotion continues; finding recorded in step summary only
#   ignore  -- finding suppressed entirely (use sparingly)

scanner_policy:
  snyk:
    critical: block
    high: block
    medium: warn
    low: record
  trivy:
    critical: block
    high: block
    medium: record
    low: ignore

    # Block only on findings that have a fix available upstream.
    #
    # This mirror is TRANSPORT: `crane copy` moves upstream bytes unchanged
    # (every catalog entry is disposition: mirror_only), so the pipeline cannot
    # patch a package. That makes an unfixable finding unactionable here: the
    # only choices are "publish anyway" or "publish nothing, ever". A finding
    # that DOES have a fix is actionable -- it means upstream shipped a build
    # that lags an available patch, and holding the tag is the right response.
    #
    # Measured on the live catalog (33 images, Trivy 0.70.0, 2026-08-25):
    # 22 images carry zero fixable CRITICAL/HIGH; 11 carry at least one and
    # stay blocked. The libuuid1 regression that prompted this change is the
    # worked example -- dhi-python:3.14-debian13 @sha256:5bbd41ae carried
    # CVE-2026-53612/53613/53614/53615 WITH a fix (2.41.5-0+deb13u1), so it
    # blocks; @sha256:11466a15 ships that fix and passes.
    #
    # This is not a blanket suppression: unfixed findings are still scanned,
    # still uploaded as SARIF, and still visible in the Security tab. They
    # simply do not gate a pipeline that has no way to act on them.
    #
    # #ASSUME the scanner's "fixed version" field is a reliable signal that an
    # upstream patch exists for the detected distro release.
    # #VERIFY when a finding must block despite having no fix, that is a policy
    #   decision, not a scanner one: raise it here (e.g. flip this to false for
    #   a hard freeze) rather than editing the workflow.
    ignore_unfixed: true

  # Upstream Cosign signature check (dhi.io or gcr.io source images).
  # Set required: true only after confirming the upstream registry uses Cosign.
  #
  # Consumed only by publish-approved-image.yml. mirror-hardened-images.yml runs
  # no upstream Cosign check for any tier.
  #
  # Vendor-tier images (source_tier: vendor, docker.io) are NOT covered by this
  # block. Docker Hub application images are mostly unsigned, and no signer
  # identity has been confirmed for any of them, so there is nothing valid to
  # pin here. The mirror-vendor job states "upstream signature NOT verified" in
  # its run summary instead, and keeps vendor signing behind its own switch
  # (MIRROR_VENDOR_SIGNING_ENABLED). Do not set required: true while vendor
  # entries are promoted through publish-approved-image.yml: it would block
  # every one of them.
  #
  # expected_identity_regexp / expected_issuer_regexp pin WHO must have signed
  # the upstream image. The default ".*" accepts any Sigstore identity, which
  # only proves a signature exists, not that the trusted publisher produced it;
  # the workflow emits a warning whenever the identity is left unpinned.
  # Confirmed signer identities (verify before adding a new source tier):
  #   gcr.io/distroless/*  identity keyless@distroless.iam.gserviceaccount.com
  #                        issuer   https://accounts.google.com
  #                        (confirmed 2026-08-25 on static-debian12,
  #                        python3-debian12 and nodejs20-debian12; both the
  #                        index digest and the per-platform digest are signed)
  #   dhi.io/*             UNKNOWN -- dhi.io requires entitlement credentials to
  #                        read a signature, so it cannot be confirmed outside a
  #                        workflow run. See docs/rt1-signing-exit.md.
  #
  # These stay unpinned HERE because this block is global: a single regexp pair
  # applies to whichever image publish-approved-image.yml is promoting, so
  # pinning the distroless signer would fail every DHI promotion. Per-source
  # pinning happens at the caller (see .github/workflows/supply-chain-mirror.yml).
  #
  # #ASSUME the DHI signer identity stays unknown until a workflow run with
  #   entitlement credentials inspects one.
  # #VERIFY run the mirror-verify workflow against a dhi.io ref with
  #   require_upstream_signature: false and read the cosign output, then record
  #   the identity + issuer here and in docs/rt1-signing-exit.md.
  upstream_cosign:
    required: false
    advisory: true
    expected_identity_regexp: ".*"
    expected_issuer_regexp: ".*"

# Exception framework.
# Each entry grants a named exemption for a specific CVE on a specific image.
# Exceptions require: justification, ticket reference, and an expiry date.
# load_scanner_policy.py reads this list and, for the image being promoted,
# emits non-expired Trivy exceptions into a generated .trivyignore so Trivy
# stops blocking on them. Snyk exceptions are surfaced as a warning (Snyk
# suppresses by its own issue id, not by CVE, so they are not auto-applied).
# Expired or undated entries are ignored (fail-safe: the finding still blocks).
#
# Schema:
#   image_id:      str  -- matches catalog/images.yaml id field
#   cve_id:        str  -- CVE identifier (e.g. CVE-2024-12345)
#   scanner:       str  -- snyk | trivy | both
#   expires:       str  -- ISO-8601 date after which the exception auto-expires
#   ticket:        str  -- issue or ticket URL tracking the underlying fix
#   justification: str  -- reason this cannot be fixed by upgrading the base
#
# Re-pin rule: exceptions are keyed by image_id and CVE, NOT by digest. Any change
# to an image's upstream digest (a re-pin) MUST re-review that image's exceptions in
# the same PR: re-scan the new digest, delete entries that no longer apply, and
# refuse to carry forward entries for CVEs that were never reviewed against the new
# bytes. Vendor-tier exceptions (vendor-*) are transport-copy exceptions: we cannot
# patch those bytes, so each carries a short expiry and a tracking issue.
#
# Secret exceptions (secret_exceptions, below the CVE list) follow the same expiry,
# ticket and re-pin rules but are narrower: one entry names ONE rule and ONE exact
# absolute file path inside the image. Globs, relative paths and ".." segments are
# rejected by the loader, so a finding in any other file still blocks. They are
# rendered into a generated YAML ignore file (Trivy 0.70 `secrets:` section) only
# for vendor promotion; other tiers never receive them.
#
# Secret schema:
#   image_id:      str  -- matches catalog/images.yaml id field
#   rule_id:       str  -- Trivy secret rule id (e.g. private-key)
#   path:          str  -- exact absolute path inside the image, leading slash
#   expires:       str  -- ISO-8601 date after which the exception auto-expires
#   ticket:        str  -- issue URL tracking the underlying fix
#   justification: str  -- why the file is not a usable credential at runtime
