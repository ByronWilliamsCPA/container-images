# REUSE Compliance Check for container-images
# Validates REUSE 3.0 specification compliance for license management.
#
# Pattern: an in-line job named "Check REUSE Compliance" emits the literal
# check context "Check REUSE Compliance" required by the org default-branch
# ruleset. Calling the org-level reusable workflow would instead emit
# "Check REUSE Compliance / REUSE Compliance Check" and miss the required
# context.
#
# REUSE documentation: https://reuse.software/
name: REUSE Compliance

# PR-only: "Check REUSE Compliance" is a required status check in the org
# default-branch ruleset, so every merge already validated this exact tree on
# the PR. A post-merge push run re-checks identical content for no gain.
"on":
  pull_request:
    paths:
      - "**/*"
      - "REUSE.toml"
      - "LICENSES/**"
      - ".github/workflows/reuse.yml"
  merge_group:

permissions: {}

concurrency:
  group: reuse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Generate REUSE SPDX
        if: success()
        run: |
          docker run --rm --volume "$(pwd)":/data fsfe/reuse:latest spdx --output /data/reuse-spdx.json

      - name: Upload REUSE SPDX
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reuse-spdx
          path: reuse-spdx.json
          retention-days: 90
