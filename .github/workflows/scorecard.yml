# =============================================================================
# OpenSSF Scorecard
# =============================================================================
# Runs the OpenSSF Scorecard on every push to main and on a weekly schedule.
# Results are published to the OpenSSF Scorecard API and uploaded as a
# workflow artifact (GitHub Advanced Security / Code Security is not active
# on this repo, so results no longer go to the GitHub Security tab).
# =============================================================================

name: Scorecard

on:
  schedule:
    - cron: '30 1 * * 1'  # Weekly, Monday 1:30 AM UTC
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # egress-policy: block deferred pending allowed-endpoints verification (see #18)
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
